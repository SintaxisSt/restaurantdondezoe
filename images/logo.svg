<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8B830;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F2C744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8B830;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redCircleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D42027;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A31A1F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D7A2D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A5C1A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#00000033"/>
    </filter>
  </defs>
  
  <!-- Background circle white -->
  <circle cx="200" cy="190" r="175" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Red circle -->
  <circle cx="200" cy="190" r="155" fill="url(#redCircleGrad)"/>
  
  <!-- Left laurel leaves -->
  <g transform="translate(60, 100)">
    <ellipse cx="30" cy="20" rx="18" ry="40" fill="url(#leafGrad)" transform="rotate(-30, 30, 20)"/>
    <ellipse cx="20" cy="70" rx="16" ry="35" fill="url(#leafGrad)" transform="rotate(-20, 20, 70)"/>
    <ellipse cx="15" cy="120" rx="15" ry="32" fill="url(#leafGrad)" transform="rotate(-10, 15, 120)"/>
    <ellipse cx="18" cy="165" rx="14" ry="30" fill="url(#leafGrad)" transform="rotate(0, 18, 165)"/>
    <ellipse cx="25" cy="205" rx="13" ry="28" fill="url(#leafGrad)" transform="rotate(10, 25, 205)"/>
  </g>
  
  <!-- Right laurel leaves -->
  <g transform="translate(270, 100)">
    <ellipse cx="50" cy="20" rx="18" ry="40" fill="url(#leafGrad)" transform="rotate(30, 50, 20)"/>
    <ellipse cx="60" cy="70" rx="16" ry="35" fill="url(#leafGrad)" transform="rotate(20, 60, 70)"/>
    <ellipse cx="65" cy="120" rx="15" ry="32" fill="url(#leafGrad)" transform="rotate(10, 65, 120)"/>
    <ellipse cx="62" cy="165" rx="14" ry="30" fill="url(#leafGrad)" transform="rotate(0, 62, 165)"/>
    <ellipse cx="55" cy="205" rx="13" ry="28" fill="url(#leafGrad)" transform="rotate(-10, 55, 205)"/>
  </g>
  
  <!-- Chef hat white -->
  <ellipse cx="200" cy="115" rx="55" ry="35" fill="#FFFFFF"/>
  <rect x="155" y="100" width="90" height="40" rx="5" fill="#FFFFFF"/>
  <ellipse cx="200" cy="95" rx="45" ry="25" fill="#FFFFFF"/>
  <ellipse cx="180" cy="90" rx="20" ry="18" fill="#F5F5F5"/>
  <ellipse cx="220" cy="90" rx="20" ry="18" fill="#F5F5F5"/>
  
  <!-- Hair black -->
  <path d="M155 140 Q155 110 175 105 Q195 100 200 105 Q205 100 225 105 Q245 110 245 140 L245 170 Q245 175 240 175 L160 175 Q155 175 155 170 Z" fill="#1A1A1A"/>
  <ellipse cx="155" cy="155" rx="12" ry="25" fill="#1A1A1A"/>
  <ellipse cx="245" cy="155" rx="12" ry="25" fill="#1A1A1A"/>
  
  <!-- Face skin -->
  <ellipse cx="200" cy="175" rx="48" ry="42" fill="#F5D0A9"/>
  
  <!-- Eyes -->
  <ellipse cx="182" cy="170" rx="10" ry="12" fill="#FFFFFF"/>
  <ellipse cx="218" cy="170" rx="10" ry="12" fill="#FFFFFF"/>
  <circle cx="184" cy="172" r="6" fill="#1A1A1A"/>
  <circle cx="220" cy="172" r="6" fill="#1A1A1A"/>
  <circle cx="186" cy="169" r="2" fill="#FFFFFF"/>
  <circle cx="222" cy="169" r="2" fill="#FFFFFF"/>
  
  <!-- Eyebrows -->
  <path d="M172 158 Q182 152 192 156" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M208 156 Q218 152 228 158" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Blush cheeks -->
  <ellipse cx="168" cy="182" rx="10" ry="6" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="232" cy="182" rx="10" ry="6" fill="#FFB6C1" opacity="0.6"/>
  
  <!-- Nose -->
  <ellipse cx="200" cy="180" rx="4" ry="3" fill="#E8B89D"/>
  
  <!-- Smile -->
  <path d="M188 192 Q200 202 212 192" stroke="#C47A6C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Red scarf -->
  <path d="M165 210 Q200 225 235 210 L240 240 Q200 255 160 240 Z" fill="#D42027"/>
  <path d="M195 240 L185 280 Q200 285 215 280 L205 240" fill="#D42027"/>
  
  <!-- Chef uniform white -->
  <path d="M160 240 Q160 220 170 215 L200 225 L230 215 Q240 220 240 240 L240 290 Q200 300 160 290 Z" fill="#FFFFFF"/>
  
  <!-- Buttons -->
  <circle cx="200" cy="245" r="3" fill="#1A1A1A"/>
  <circle cx="200" cy="260" r="3" fill="#1A1A1A"/>
  <circle cx="200" cy="275" r="3" fill="#1A1A1A"/>
  
  <!-- OK hand gesture -->
  <g transform="translate(120, 230)">
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="#F5D0A9"/>
    <circle cx="0" cy="-8" r="6" fill="#F5D0A9"/>
    <circle cx="8" cy="-5" r="4" fill="#F5D0A9"/>
    <circle cx="-8" cy="-5" r="4" fill="#F5D0A9"/>
    <circle cx="5" cy="-12" r="3" fill="#F5D0A9"/>
    <circle cx="-5" cy="-12" r="3" fill="#F5D0A9"/>
  </g>
  
  <!-- Yellow ribbon -->
  <path d="M80 320 Q80 310 100 310 L300 310 Q320 310 320 320 L320 340 Q300 350 200 350 Q100 350 80 340 Z" fill="url(#ribbonGrad)" filter="url(#shadow)"/>
  
  <!-- Ribbon folds -->
  <path d="M80 320 L60 315 L60 345 L80 340" fill="#C9A020"/>
  <path d="M320 320 L340 315 L340 345 L320 340" fill="#C9A020"/>
  
  <!-- Hearts -->
  <path d="M95 328 Q95 322 100 322 Q105 322 105 328 Q105 335 100 340 Q95 335 95 328" fill="#D42027"/>
  <path d="M300 328 Q300 322 305 322 Q310 322 310 328 Q310 335 305 340 Q300 335 300 328" fill="#D42027"/>
  
  <!-- Text DONDE ZOE -->
  <text x="200" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1A1A1A" letter-spacing="3">DONDE ZOE</text>
  
  <!-- Small decorative dots -->
  <circle cx="130" cy="330" r="2" fill="#D42027"/>
  <circle cx="270" cy="330" r="2" fill="#D42027"/>
</svg>
